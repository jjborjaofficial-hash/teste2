version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aprenda-e-ganhe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: aprenda_e_ganhe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d aprenda_e_ganhe"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aprenda-e-ganhe-cache
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
