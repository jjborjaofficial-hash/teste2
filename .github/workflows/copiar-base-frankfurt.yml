# TEMPORÁRIO: copia a base de dados antiga (Londres) para a nova (Frankfurt).
# Só corre à mão (Actions > "Copiar base para Frankfurt" > Run workflow).
# Usa 2 secrets do GitHub: OLD_DATABASE_URL e NEW_DATABASE_URL. Nunca escrever endereços aqui.
# Depois de a mudança estar feita, apagar este ficheiro.
name: Copiar base para Frankfurt

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escreve COPIAR para confirmar'
        required: true

jobs:
  copiar:
    if: ${{ github.event.inputs.confirmar == 'COPIAR' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que os secrets existem
        env:
          OLD: ${{ secrets.OLD_DATABASE_URL }}
          NEW: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          test -n "$OLD" || { echo "Falta o secret OLD_DATABASE_URL"; exit 1; }
          test -n "$NEW" || { echo "Falta o secret NEW_DATABASE_URL"; exit 1; }
          test "$OLD" != "$NEW" || { echo "Os dois endereços são iguais. Parar."; exit 1; }

      - name: Garantir que a base nova está vazia
        env:
          NEW: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          n=$(docker run --rm postgres:18 psql "$NEW" -tAc "select count(*) from information_schema.tables where table_schema='public'")
          echo "Tabelas na base nova: $n"
          test "$n" = "0" || { echo "A base nova NÃO está vazia. Parar para não estragar nada."; exit 1; }

      - name: Copiar (estrutura + dados)
        env:
          OLD: ${{ secrets.OLD_DATABASE_URL }}
          NEW: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          docker run --rm postgres:18 pg_dump "$OLD" --no-owner --no-privileges --format=plain \
            | docker run -i --rm postgres:18 psql "$NEW" -v ON_ERROR_STOP=1 --single-transaction -q

      - name: Comparar contagens de linhas (antiga vs nova)
        env:
          OLD: ${{ secrets.OLD_DATABASE_URL }}
          NEW: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          Q="select table_name from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by 1"
          falhou=0
          for t in $(docker run --rm postgres:18 psql "$OLD" -tAc "$Q"); do
            a=$(docker run --rm postgres:18 psql "$OLD" -tAc "select count(*) from public.\"$t\"")
            b=$(docker run --rm postgres:18 psql "$NEW" -tAc "select count(*) from public.\"$t\"")
            if [ "$a" = "$b" ]; then echo "OK   $t: $a"; else echo "DIFERENTE $t: antiga=$a nova=$b"; falhou=1; fi
          done
          exit $falhou
