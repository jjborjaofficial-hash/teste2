# Passo temporário: só corre no ramo chore/bcrypt-6. Atualiza o pacote bcrypt (5 -> 6) e
# guarda o novo package.json e package-lock.json no próprio ramo. Os testes completos correm
# depois, no fiscal "Testes", num push normal. NÃO toca no main e não faz deploy.
# Segurança: não usa nenhuma senha ou chave; só o token automático do GitHub deste repositório.
name: Atualizar bcrypt (temporário)

on:
  push:
    branches: [chore/bcrypt-6]
    paths: [.github/workflows/atualizar-bcrypt.yml]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Atualizar bcrypt para a versão 6
        run: npm install bcrypt@^6 --save --no-audit --no-fund
      - name: Mostrar versão instalada
        run: node -e "console.log('bcrypt', require('bcrypt/package.json').version)"
      - name: Guardar no ramo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bcrypt 5 -> 6 (atualização automática, a testar)" || echo "Sem alterações"
          git push
